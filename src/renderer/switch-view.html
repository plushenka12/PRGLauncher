<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self' blob: mediastream:; img-src 'self' data:">
<title>Nintendo Switch</title>
<link href="./fonts/fonts.css" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fff;font:600 15px/1.45 'Manrope','Segoe UI',sans-serif;cursor:none}
  body.pointer{cursor:default}
  video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  .hud{position:fixed;left:24px;top:24px;max-width:min(560px,calc(100% - 48px));padding:12px 16px;border-radius:12px;background:rgba(0,0,0,.72);opacity:1;transition:opacity .4s cubic-bezier(.23,1,.32,1)}
  .hud.hide{opacity:0}
  .hud b{display:block;font-size:16px;font-weight:800}
  .hud span{display:block;color:rgba(255,255,255,.75);font-size:13px}
  .hud.error{left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;padding:20px 24px}
  .hud.error b{font-size:18px}
  .clip{position:fixed;right:24px;top:24px;padding:10px 16px;border:0;border-radius:12px;background:rgba(0,0,0,.72);color:#fff;font:inherit;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s cubic-bezier(.23,1,.32,1)}
  .clip[hidden]{display:none}
  body.pointer .clip{opacity:1;pointer-events:auto}
  .clip:hover{background:rgba(255,255,255,.18)}
  @media (prefers-reduced-motion:reduce){.hud,.clip{transition:none}}
</style>
</head>
<body>
<video id="video" autoplay playsinline></video>
<div class="hud" id="hud" role="status" aria-live="polite"></div>
<button class="clip" id="clip" type="button" hidden></button>
<script src="./switch-replay.js"></script>
<script src="./switch-view.js"></script>
</body>
</html>
