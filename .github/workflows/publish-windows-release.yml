name: Publish Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build installer and publish release
    runs-on: windows-latest

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Check release tag against package version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne $packageVersion) {
            throw "Tag $env:RELEASE_TAG does not match package version $packageVersion"
          }

      - name: Install dependencies
        run: npm ci

      - name: Check Chrome for UI tests
        shell: pwsh
        run: if (-not (Test-Path $env:PRG_TEST_BROWSER)) { throw "Chrome not found at $env:PRG_TEST_BROWSER" }
        env:
          PRG_TEST_BROWSER: C:\Program Files\Google\Chrome\Application\chrome.exe

      - name: Run tests
        run: npm test
        env:
          PRG_TEST_BROWSER: C:\Program Files\Google\Chrome\Application\chrome.exe

      - name: Test Firestore rules and two-client sync
        run: npx.cmd firebase emulators:exec --only firestore --project demo-prglauncher "npm.cmd run test:emulator"
        env:
          FIREBASE_TOOLS_DISABLE_UPDATE_CHECK: 'true'

      - name: Lint Markdown
        run: npm run lint:md

      - name: Build Windows installer
        run: npm run build -- --publish never

      - name: Run release gate
        run: npm run release:check

      - name: Create or update GitHub Release
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const title = `PRGLauncher ${tag}`;
            const changelogLines = fs.readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);
            const start = changelogLines.findIndex(line => line === `## ${tag}` || line.startsWith(`## ${tag} —`));
            if (start < 0) throw new Error(`Missing CHANGELOG.md section for ${tag}`);
            const endOffset = changelogLines.slice(start + 1).findIndex(line => line.startsWith('## '));
            const end = endOffset < 0 ? changelogLines.length : start + 1 + endOffset;
            const notes = changelogLines.slice(start + 1, end).join('\n').trim();
            if (!notes) throw new Error(`Empty CHANGELOG.md section for ${tag}`);
            const body = `## PRGLauncher ${tag}\n\n${notes}`;

            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag }));
              ({ data: release } = await github.rest.repos.updateRelease({
                owner, repo, release_id: release.id, name: title, body,
                draft: false, prerelease: false, make_latest: 'true',
              }));
            } catch (error) {
              if (error.status !== 404) throw error;
              ({ data: release } = await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, name: title, body,
                draft: false, prerelease: false, make_latest: 'true',
              }));
            }

            const files = [
              `PRGLauncher-Setup-${tag}.exe`,
              `PRGLauncher-Setup-${tag}.exe.blockmap`,
              'latest.yml',
            ];
            const contentTypes = {
              '.exe': 'application/vnd.microsoft.portable-executable',
              '.blockmap': 'application/octet-stream',
              '.yml': 'text/yaml',
            };
            const existing = new Map(release.assets.map(asset => [asset.name, asset]));
            for (const name of files) {
              const asset = existing.get(name);
              if (asset) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
              const filePath = path.join(process.cwd(), 'release', name);
              const data = fs.readFileSync(filePath);
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name, data,
                headers: { 'content-type': contentTypes[path.extname(name)] || 'application/octet-stream', 'content-length': data.length },
              });
            }
