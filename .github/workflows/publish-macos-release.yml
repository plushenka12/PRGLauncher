name: Publish macOS release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and update
        required: true
        default: '1.2.2'
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build and attach universal macOS DMG
    runs-on: macos-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned universal DMG
        run: npm run build:mac -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Attach DMG to GitHub Release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            const files = fs.readdirSync(path.join(process.cwd(), 'release'))
              .filter(name => name.endsWith('.dmg') || name === 'latest-mac.yml' || name.endsWith('.dmg.blockmap'));
            if (!files.length) throw new Error('No DMG was produced.');
            for (const name of files) {
              const old = release.assets.find(asset => asset.name === name);
              if (old) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: old.id });
              const filePath = path.join(process.cwd(), 'release', name);
              const data = fs.readFileSync(filePath);
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name, data,
                headers: { 'content-type': 'application/x-apple-diskimage', 'content-length': data.length },
              });
            }
