name: Windows checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Test Firestore rules and two-client sync
        run: npx.cmd firebase emulators:exec --only firestore --project demo-prglauncher "npm.cmd run test:emulator"
        env:
          FIREBASE_TOOLS_DISABLE_UPDATE_CHECK: 'true'
      - name: Lint Markdown
        run: npm run lint:md
