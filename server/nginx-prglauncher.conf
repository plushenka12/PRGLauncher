# PRGLauncher guest site and server functions. certbot --nginx adds the
# HTTPS server block and the HTTP -> HTTPS redirect to this file.
limit_req_zone $binary_remote_addr zone=prg_functions:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name prg.145-241-163-181.sslip.io;

    root /var/www/prglauncher;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /.netlify/functions/ {
        limit_req zone=prg_functions burst=20 nodelay;
        limit_except POST { deny all; }
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # Profile links of the form /u/<id> show the guest page, as on Netlify.
    location /u/ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
